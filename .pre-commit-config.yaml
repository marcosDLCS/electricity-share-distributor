# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      # Run Ruff linter with auto-fixing
      - id: ruff
        args: [--fix]
      # Run Ruff formatter (Python Prettier)
      - id: ruff-format

  - repo: local
    hooks:
      - id: privacy-cups-checker
        name: CUPS Privacy & Anonymization Enforcer
        entry: python3 -m src.security
        language: system
        pass_filenames: false
      - id: calver-version
        name: CalVer Version Enforcer
        entry: python3 -m src.version hook
        language: system
        pass_filenames: false
